<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RxCalc - Pharmacy Tools</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col">

    <!-- Header & Navigation Bar -->
    <header class="bg-[#0f172a] text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-teal-500 rounded-xl flex items-center justify-center text-slate-900 font-black text-xl">
                    Rx
                </div>
                <div>
                    <h1 class="text-xl font-bold leading-none">RxCalc</h1>
                    <p class="text-xs text-slate-400">PHARMACY TOOLS</p>
                </div>
            </div>

            <!-- Navigation Buttons -->
            <nav class="flex items-center gap-2 bg-slate-900 p-1.5 rounded-2xl border border-slate-800">
                <button id="nav-insulin" class="nav-btn px-4 py-2 rounded-xl text-xs font-bold transition-all bg-teal-500 text-slate-900 shadow">
                    Insulin Calc
                </button>
                <button id="nav-tb" class="nav-btn px-4 py-2 rounded-xl text-xs font-bold transition-all text-slate-300 hover:text-white hover:bg-slate-800">
                    TB Calc
                </button>
                <button id="nav-dapt" class="nav-btn px-4 py-2 rounded-xl text-xs font-bold transition-all text-slate-300 hover:text-white hover:bg-slate-800">
                    DAPT Calc
                </button>
            </nav>
        </div>
    </header>

    <!-- Dynamic Container For Modules -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
        <div id="app"></div>
    </main>

    <!-- Main Entry Script -->
    <script type="module" src="./app.js"></script>
</body>
</html>
