<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RxCalc - Pharmacy Tools</title>
    
    <!-- Google Fonts: Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo-container">
            <div class="logo-icon"><i class="fa-solid fa-calculator"></i></div>
            <div class="logo-text">
                <h1>RxCalc</h1>
                <span>PHARMACY TOOLS</span>
            </div>
        </div>
        <button class="btn-home" onclick="location.reload()"><i class="fa-solid fa-house"></i> Home</button>
    </header>

    <main class="container">
        <h2>เครื่องมือคำนวณทางเภสัชกรรม</h2>
        <p class="subtitle">เลือกเครื่องมือที่ต้องการใช้งานจากรายการด้านล่าง</p>

        <div class="card-grid">
            <!-- เหลือแค่ Card เดียวคือ Insulin Calculator -->
            <div class="card" onclick="loadModule('insulin')">
                <div class="card-icon teal"><i class="fa-solid fa-syringe"></i></div>
                <h3>Insulin Calculator</h3>
                <p>คำนวณอินซูลิน (Penfill/Vial), อุปกรณ์เสริม (เข็ม, สำลีแอลกอฮอล์) และวันนัดถัดไป</p>
                <a class="card-link teal">เปิดใช้งานเครื่องมือ <i class="fa-solid fa-arrow-right"></i></a>
            </div>
        </div>

        <div id="module-container"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
