<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RxCalc - Pharmacy Tools</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            900: '#134e4a',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-stone-100 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- Top Navbar Header -->
    <header class="bg-slate-900 text-white shadow-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" id="nav-brand">
                <div class="w-10 h-10 bg-teal-500 text-slate-950 font-black rounded-xl flex items-center justify-center text-xl shadow-lg shadow-teal-500/20">
                    Rx
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tight leading-none text-white">RxCalc</h1>
                    <p class="text-xs font-semibold text-teal-400">PHARMACY TOOLS</p>
                </div>
            </div>

            <!-- Navigation Links -->
            <nav class="flex items-center gap-2">
                <button type="button" id="nav-btn-home" class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-all flex items-center gap-1.5">
                    <svg class="w-4 h-4 stroke-current text-teal-400" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span>Home</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content Container for Modules -->
    <main class="flex-1 py-4 sm:py-6">
        
        <!-- Home Dashboard Module Selector -->
        <div id="module-home" class="max-w-7xl mx-auto px-4">
            <div class="text-center my-8">
                <h2 class="text-3xl font-black text-slate-900 tracking-tight">เครื่องมือคำนวณทางเภสัชกรรม</h2>
                <p class="text-slate-500 mt-2 font-medium">เลือกโมดูลที่ต้องการใช้งานด้านล่าง</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 max-w-5xl mx-auto">
                <!-- Module 1 Card -->
                <button type="button" data-module="insulin" class="btn-select-module bg-white hover:border-teal-500 border border-slate-200 p-5 rounded-2xl shadow-xs transition-all text-left flex flex-col justify-between hover:shadow-md group">
                    <div class="w-12 h-12 bg-teal-50 text-teal-600 rounded-xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                        <svg class="w-6 h-6 stroke-current" fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5"/><path d="m9 11 4 4"/><path d="m5 19-3 3"/><path d="m14 4 6 6"/></svg>
                    </div>
                    <div>
                        <h3 class="font-extrabold text-slate-900 text-lg group-hover:text-teal-600 transition-colors">Insulin Calc</h3>
                        <p class="text-xs text-slate-500 mt-1">คำนวณปริมาณยาอินซูลิน เข็ม ยาฉีด และสำลีแอลกอฮอล์</p>
                    </div>
                </button>

                <!-- Module 4 Card: Smalldose -->
                <button type="button" data-module="smalldose" class="btn-select-module bg-white hover:border-indigo-500 border border-slate-200 p-5 rounded-2xl shadow-xs transition-all text-left flex flex-col justify-between hover:shadow-md group">
                    <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                        <svg class="w-6 h-6 stroke-current" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    </div>
                    <div>
                        <h3 class="font-extrabold text-slate-900 text-lg group-hover:text-indigo-600 transition-colors">Smalldose Calc</h3>
                        <p class="text-xs text-slate-500 mt-1">ขนาดยาฆ่าเชื้อในเด็กคลอดก่อนกำหนด (Preterm Neonatal Dose)</p>
                    </div>
                </button>
            </div>
        </div>

        <!-- Dynamic Module Render Mount Point -->
        <div id="app-root" class="hidden"></div>

    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs font-semibold text-slate-400 border-t border-slate-200/60 bg-stone-100">
        Design by RacNoot52 | Contact/Suggestion: shk11400.rx@gmail.com
    </footer>

    <!-- Main JavaScript App Logic -->
    <script type="module">
        import { render as renderSmalldose } from './smalldose.js';
        // import { render as renderInsulin } from './insulin-calc.js';

        const appRoot = document.getElementById('app-root');
        const moduleHome = document.getElementById('module-home');
        const navBtnHome = document.getElementById('nav-btn-home');

        function switchModule(moduleName) {
            if (moduleName === 'home') {
                appRoot.innerHTML = '';
                appRoot.classList.add('hidden');
                moduleHome.classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            moduleHome.classList.add('hidden');
            appRoot.classList.remove('hidden');

            if (moduleName === 'smalldose') {
                renderSmalldose(appRoot);
            } else if (moduleName === 'insulin') {
                // renderInsulin(appRoot);
                appRoot.innerHTML = `<div class="p-8 text-center font-bold text-slate-500">Insulin Calc Module Mounted</div>`;
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Attach Event Listeners
        document.querySelectorAll('.btn-select-module').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const mod = e.currentTarget.dataset.module;
                switchModule(mod);
            });
        });

        navBtnHome.addEventListener('click', () => switchModule('home'));
        document.getElementById('nav-brand').addEventListener('click', () => switchModule('home'));
    </script>
</body>
</html>
