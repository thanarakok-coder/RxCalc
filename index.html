<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RxCalc - Pharmacy Tools</title>

    <!-- Google Fonts: Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
            font-family: 'Prompt', sans-serif !important;
        }
        body {
            background-color: #E1DCC9;
            color: #1e293b;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased">

    <!-- Navbar Header (คงความเข้มแบบเดิม) -->
    <header class="bg-[#0f172a] text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" id="nav-logo">
                <div class="w-10 h-10 bg-teal-500 text-slate-900 rounded-xl flex items-center justify-center font-bold text-xl shadow-lg">
                    <i class="fa-solid fa-calculator"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wider text-white leading-none">RxCalc</h1>
                    <span class="text-[10px] text-teal-400 font-medium tracking-widest uppercase">PHARMACY TOOLS</span>
                </div>
            </div>
            
            <button id="nav-home-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl text-xs font-semibold transition-all border border-slate-700 flex items-center gap-2">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area (สีพื้นหลังอ่อน #E1DCC9) -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 space-y-6">
        
        <!-- Dashboard Home Page -->
        <div id="page-dashboard" class="space-y-6">
            <div>
                <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-1">เครื่องมือคำนวณทางเภสัชกรรม</h2>
                <p class="text-xs sm:text-sm text-slate-600">เลือกเครื่องมือที่ต้องการใช้งานจากรายการด้านล่าง</p>
            </div>

            <!-- Cards Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                
                <!-- Card 1: Insulin Calculator -->
                <div id="card-insulin" class="bg-white/80 backdrop-blur-sm border border-slate-300 rounded-3xl p-6 hover:border-teal-500 hover:shadow-lg transition-all cursor-pointer group flex flex-col justify-between">
                    <div>
                        <div class="w-12 h-12 bg-teal-600 text-white rounded-2xl flex items-center justify-center text-xl mb-4 group-hover:scale-105 transition-transform font-bold">
                            <i class="fa-solid fa-syringe"></i>
                        </div>
                        <h3 class="text-xl font-bold text-slate-800 mb-2">Insulin Calculator</h3>
                        <p class="text-xs text-slate-600 font-normal leading-relaxed mb-6">คำนวณอินซูลิน (Penfill/Vial), อุปกรณ์เสริม (เข็ม, สำลีแอลกอฮอล์) และวันนัดถัดไป</p>
                    </div>
                    <div class="text-teal-700 text-xs font-semibold flex items-center gap-2 group-hover:translate-x-1 transition-transform">
                        <span>เปิดใช้งานเครื่องมือ</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </div>
                </div>

            </div>
        </div>

        <!-- Dynamic Module Container (สำหรับ Render Insulin Page) -->
        <div id="module-container" class="hidden"></div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-300/60 py-4 px-4 text-center text-xs text-slate-500 font-light space-y-1">
        <p>Design by RacNoot52</p>
        <p>Contact/Suggestion : <a href="mailto:shk11400.rx@gmail.com" class="hover:underline text-slate-600">shk11400.rx@gmail.com</a></p>
    </footer>

    <!-- Application Script -->
    <script type="module">
        const dashboard = document.getElementById('page-dashboard');
        const moduleContainer = document.getElementById('module-container');
        const cardInsulin = document.getElementById('card-insulin');
        const btnHome = document.getElementById('nav-home-btn');
        const navLogo = document.getElementById('nav-logo');

        function goHome() {
            dashboard.classList.remove('hidden');
            moduleContainer.classList.add('hidden');
            moduleContainer.innerHTML = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function loadInsulinModule() {
            dashboard.classList.add('hidden');
            moduleContainer.classList.remove('hidden');
            moduleContainer.innerHTML = '<div class="p-8 text-center text-slate-600"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><p>กำลังโหลดโมดูล...</p></div>';

            try {
                // ดึงโมดูล insulin-calc.js
                const module = await import('./modules/insulin-calc.js');
                moduleContainer.innerHTML = '';
                
                if (typeof module.render === 'function') {
                    module.render(moduleContainer);
                } else if (typeof module.default === 'function') {
                    module.default(moduleContainer);
                }
            } catch (err) {
                console.error('Failed to load insulin module:', err);
                moduleContainer.innerHTML = `
                    <div class="bg-red-50 border border-red-200 text-red-700 p-6 rounded-2xl">
                        <h4 class="font-bold mb-2"><i class="fa-solid fa-triangle-exclamation"></i> ไม่สามารถโหลดโมดูลได้</h4>
                        <p class="text-xs mb-4">โปรดตรวจสอบว่ามีไฟล์ <code>modules/insulin-calc.js</code> อยู่ในโปรเจกต์</p>
                        <button onclick="location.reload()" class="bg-red-600 text-white px-4 py-2 rounded-xl text-xs">ลองใหม่อีกครั้ง</button>
                    </div>
                `;
            }
        }

        cardInsulin.addEventListener('click', loadInsulinModule);
        btnHome.addEventListener('click', goHome);
        navLogo.addEventListener('click', goHome);
    </script>
</body>
</html>
